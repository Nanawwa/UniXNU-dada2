[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/check-dada.py", "docs/patches/**"]
inputs = ["uefi-dada, the Mu-Silicium fork that owns Platforms/Xiaomi/dadaPkg; UEFI FD at 0xA7100000 of size 0x300000; Resources/Configs/dada.toml; stock firmware DTB Resources/DTBs/dada.dtb; five Mu_Basecore patches; vendor binaries in Binaries (branch dada)."]
configuration = ["firmware.config = dada; firmware.dsc = Platforms/Xiaomi/dadaPkg/dada.dsc; firmware.fd = Build/dadaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "firmware.preflight runs scripts/check-dada.py; firmware.submodules and firmware.patches list every tree input the EDK II build needs.", "The DSC embeds UniXNU, UniXNUDxe and DarwinBoot, so the firmware volume starts the UniXNU menu and hands the kernel to DarwinBoot."]
procedure = ["Run ./unixnu build firmware -D ../UniXNU-dada --uefi ../uefi-dada.", "Inspect the preflight report: memory descriptors, vendor inputs, FD and stack descriptors, UFS window coverage and kernel archive consistency.", "Run ./unixnu bootimg -D ../UniXNU-dada --uefi ../uefi-dada --dtb <firmware.dtb> and inspect boot.json."]
findings = ["The firmware volume must be exactly 0x300000 bytes at 0xA7100000. MemoryMapLib.c and dada.dsc are the two sources of that geometry, and the preflight refuses a mismatch.", "The DSC/FDF embed UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot. UniXNURamDiskDxe publishes the boot image's FAT initrd from the Mu-Silicium FDT handoff, so without it the menu cannot read unixnu.toml; the shared DiskIoDxe, FAT and PartitionDxe drivers are in the same volume.", "The stock bootloader takes Android header v4 with the device tree appended. UniXNU's verify() did not accept v4, so docs/patches/unixnu-bootimg-header-v4.patch records the missing verification path; the Mu-Silicium BootShim patch corrects the ARM64 image_size to cover the shim plus the volume.", "On 2026-10-26 the firmware rebuilt from uefi-dada and its pinned Mu_Basecore: SILICIUM_UEFI.fd, 0x300000 bytes, sha256 e53a559c9a9a4293a5ab72b86a4d08b3cd231e88863d5bcc198445c5a505ff28, with the five Mu_Basecore patches applied and reverted around the build.", "Silicium-ACPI is not part of this board's package set: dada ships its ACPI tables inside Platforms/Xiaomi/dadaPkg."]
completion = ["Firmware image builds, enters UniXNU, publishes the GOP framebuffer and preserves the documented memory reservations."]
limits = ["The firmware builds only with the pinned Mu_Basecore and the five Mu patches; a different edk2 revision can change the volume or refuse the patches.", "docs/patches/mu-silicium-unixnu-ramdisk.patch is needed on a fresh uefi-dada checkout until the DSC/FDF integration is upstreamed."]
next_action = ["Boot the image on the phone, confirm the menu lists the payload and DarwinBoot starts the kernel, and record the firmware commit with the result."]


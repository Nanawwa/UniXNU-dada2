[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "configs/**"]
inputs = ["DRAM base 0x80000000. The stock tree reports 15.12 GiB in 16 regions; the largest are 8 GiB at 0xa00000000 and 5 GiB at 0x8c0000000, with gunyah owning 0x80000000..0x81200000.", "Splash region at 0xfc800000 of size 0x2b00000, handed over live by the UEFI GOP.", "DarwinBoot window request: 256 MiB as one conventional-memory run."]
configuration = ["device_tree.source = device:dts/dada.dts with soc:dts as the include directory.", "dts/dada.dts declares one memory range of 0x80000000 bytes at 0x80000000 and the reserved-memory splash region.", "payload.dram_size = 0x80000000 must equal the DTS memory range; payload.adt.owned_memory_size = 0x10000000 is the loader's contiguous request."]
procedure = ["Compare the firmware memory map, the DTS memory range and the generated /chosen dram-base/dram-size.", "Check every reserved region against the firmware descriptors before changing the handoff window."]
findings = ["The ADT carries one contiguous dram-base/dram-size pair, so the fragmented SM8750 map cannot be described. 2 GiB from 0x80000000 is the conservative first-boot value.", "256 MiB is the only window size measured to allocate on this phone; 1 GiB was never observed to be available as one run.", "The splash node must keep its exact name and no unit address for the stock ABL lookup; the boot image takes the firmware DTB, not this hardware DTS, so no bootimg.dtb_node override is needed."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 2 GiB window and the 256 MiB request are first-boot values, not the measured DRAM layout. No DMA consumer is enabled yet."]
next_action = ["Record the SMEM RAM table, then raise dram_size and owned_memory_size together with a measured allocation."]


[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot", "SoftwareAES"]
paths = ["patches/xnu/series", "package/unixnu.toml", "scripts/*payload*", "scripts/*boot*", "docs/patches/**"]
inputs = ["Prelinked kernel, compiled hardware DTB, generated ADT sidecar, optional trust cache and Data seed, platform seed and the firmware DTB.", "The target kernelcache pinned by kernelcache_sha256, and the boot image parameters from Resources/Configs/dada.toml."]
configuration = ["payload.volume = DADAESP, 192 MiB, loader = firmware.", "kernel.patch_series applies arch, SoC, OS and device series in order; kernel.prelink.roots is the reduced 24-component list without AMFI, its dependents and the PMGR.", "payload.adt carries the chip id, the DarwinBoot window, the root volume UUID and the packed Data ramdisk flag; typed [adt] tables carry the board identity overrides."]
procedure = ["Run ./unixnu build kernel, then build package, payload and bootimg in that order.", "Inspect payload.json and boot.json and keep the extracted ADT with the hardware DTB."]
findings = ["Format 2 compiles the hardware DTS and generates the ADT centrally. The format-1 make-dada-adt.py tool is gone; its board properties now live in dts/dada.dts and the typed [adt] tables.", "On 2026-10-26 the Linux toolchain built the kernel, prelinked it and packaged the payload and boot image: 24 prelink components with no AMFI or PMGR, a 50954240-byte kernel.macho, a 192 MiB DADAESP payload and a 203558912-byte Android header v4 boot image. docs/evidence/ records the commands and hashes.", "The payload guard required sheng-pmgr=2 and a linked _sheng_pmgr_run symbol for every native UFS root. That requirement exists because prelinked AMFI asks the PMGR for policy; this board prelinks no AMFI, so scripts/unixnu/payload.py now applies the check only when AMFI is in the resolved prelink roots (docs/patches/unixnu-payload-amfi-guard.patch).", "UniXNU's bootimg verification accepted header v0-v2 only. docs/patches/unixnu-bootimg-header-v4.patch adds the v4 header, the 4 KiB signature block and the address-less header fields; it is applied to the local checkout until upstreamed.", "The ESP (/dev/block/sda35, 1.117 GiB) carries the payload for initrd-less firmware boots. It is FAT32 with 4096-byte logical sectors and 4-sector clusters; a 512-byte-sector payload image fails to mount on the 4K UFS device (FAT-fs: logical sector size too small). docs/known-values.md records the geometry and the deployed kernel/ADT hashes."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The image is built on the host but not flashed or booted on hardware. The platform seed in the local build is a placeholder, and no Data or trust-cache input is packaged; replace the seed and add those inputs before a userland stage."]
next_action = ["Run fastboot boot with the recorded image, capture the last console checkpoint, and add the device result with the published revision."]


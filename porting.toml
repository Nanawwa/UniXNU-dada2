[[area]]
id = "cpu"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["dts/**", "package/unixnu.toml"]
inputs = ["Eight cores with MPIDR affinities 0x000, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000 and 0x10100.", "GICv3 distributor at 0x16000000 (0x10000) and redistributors at 0x16080000 (0x200000) with a 0x40000 stride. Timer at 19.2 MHz. PSCI through SMC."]
configuration = ["dts/dada.dts includes sm8750.dtsi and adds the timer rate, the board memory and the ADT exports.", "&intc exports unixnu,adt-name = intc with its two register ranges and redistributor-stride. &{/soc} exports the UFS node as ufshc.", "The defconfig selects XNU_ARM_DT_PLATFORM and XNU_ARMCPU; armcpu-diagnostics=1 is in the kernel arguments."]
procedure = ["Compile the board DTS with dtc and generate the ADT with scripts/make-adt.py.", "Inspect /cpus, /psci and /arm-io/intc in the generated ADT; ArmCpu maps the distributor and redistributors through the arm-io ranges window.", "After a boot, read the armcpu diagnostic counters from the serial or video console."]
findings = ["ArmCpu looks up /arm-io/intc and requires a 4-cell reg property, the arm,gic-v3 compatible and a 3-cell arm-io ranges mapping. The exported ranges are offsets from the arm-io base, not absolute addresses.", "SM8750 numbers its two prime cores above 0xffff, so an affinity is a u32 MPIDR value rather than a 16-bit CPU number. The generator accepts that and rejects a nonzero Aff0.", "Secondary CPUs start only with sheng-smp=1; the current command line leaves them parked, so the first boot exercises the boot CPU's timer and interrupt paths alone."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Only the boot CPU is started by the current kernel arguments. Redistributor size and stride are taken from the stock tree and have not been read back on hardware."]
next_action = ["Add sheng-smp=1 once the boot CPU reaches the root-mount milestone, then record per-CPU entry and IPI delivery."]


procedure = ["Document each clock, regulator and firmware-owned state before enabling power transitions.", "Check battery and charger observations only after a power source service exists."]
findings = ["Without a PMGR nub, AMFI cannot ask for a policy decision, which is why AMFI is not prelinked and the trust cache runtime is compiled out.", "The sheng payload pairs native-ufs-root=1 with sheng-pmgr=2 because prelinked AMFI needs a PMGR. This board prelinks no AMFI and passes no sheng-pmgr argument; the payload guard now applies only when AMFI is a prelink root."]

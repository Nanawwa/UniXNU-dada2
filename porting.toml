schema_version = 1

[device]
name = "dada"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 15 (dada) uses shared SM8750 support, the iPadOS 17.7.11 profile, and board-owned firmware, memory and storage integration. The port reached XNU's root-mount panic on the phone; the UFS root and userland are the next milestones. This record separates implemented code from the host and device evidence each milestone still needs."

[[area]]
id = "configuration"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["SM8750 SoC source UniXNU-sm8750-common pinned in feeds.toml; iPadOS 17.7.11 build 21H461 OS profile; dada2_defconfig; canonical component checkouts."]
configuration = ["schema_version = 2; board.soc_source = sm8750; board.os_profile = ipados-17.7.11-21H461.", "components.include selects ArmDTPlatform, ArmCpu, SoftwareAES, DadaUfs2, XnuPrelink and DarwinBoot; VirtioMmioBlock arrives as DadaUfs2's dependency.", "config_fragments applies arch, SoC, OS and then the device defconfig; patch_series lists the same four layers."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig dada2_defconfig -D ../UniXNU-dada from UniXNU.", "Run ./unixnu status --json -D ../UniXNU-dada and ./unixnu tree -D ../UniXNU-dada. Review profiles, module origins, component order and patch order."]
findings = ["Tables merge in ARM64, SoC, OS, device order. Ordinary arrays replace the inherited array, so kernel.archives carries the complete ordered plan and kernel.prelink.roots the complete reduced root list.", "The catalog still accepts the legacy Native* names as aliases, but this repository uses canonical IDs for directories, selections, archive commands and documentation. Source filenames and runtime class names stay as the catalog records them.", "The board fork registers DadaUfs2 in UniXNU's components.toml with this repository as its source. The entry is a local framework change until it is upstreamed with the component.", "The SoC pin is consumed through a local.toml override while the board is developed offline; the published pin remains the feeds.toml commit."]
completion = ["All source pins resolve; every selected component and dependency has an area in this record; status shows the intended overrides and patch order."]
limits = ["Host and device evidence entries name a published commit. This record's implementation entries describe the sources at the current revision; re-run the resolver after any profile, source or selection change.", "feeds.toml names the maintainer's SM8750 common repository; the pin only resolves on a clean machine once that repository is published. Use local.toml until then."]
next_action = ["Compare the resolved status output with this record whenever a profile, source or component selection changes."]


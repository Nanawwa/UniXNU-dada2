[[area]]
id = "storage"
status = "implemented"
components = ["DadaUfs2", "VirtioMmioBlock"]
paths = ["drivers/DadaUfs2", "docs/ufs-dada.md", "scripts/*storage*", "scripts/*ufs*"]
inputs = ["UFS host at 0x01d84000 (0x3000), PHY at 0x01d80000 (0x2000), ICE at 0x01d88000. GCC base 0x00100000 with SM8750 UFS branch offsets.", "Accepted controller compatibles: qcom,ufshc (the stock tree), qcom,sm8750-ufshc and qcom,sm8550-ufshc.", "GPT entry linux on LUN 0: first_lba 101074176, last_lba 125488383 at 4096-byte LBAs, carrying the SHNGROOT manifest and the OS/SystemOS windows.", "Root volume UUID 04769D26-2CA0-4825-B443-E2E5F88300F2 read from the OS image's APSB superblock."]
configuration = ["Select DadaUfs2; CONFIG_XNU_NATIVE_UFS=y, CONFIG_XNU_NATIVE_UFS_ARCHIVE names the board archive, and native-ufs-root=1 enables the root window path.", "kernel.archives builds the IOBlockStorageDevice reference object and then rebinds the transport imports to the prelinked kext addresses.", "dts/dada.dts exports the UFS node as ufshc; board [userdata] records the partition geometry and the two windows."]
procedure = ["Read https://unixnu.com/porting/ufs with this record and docs/ufs-dada.md.", "Inspect clock enables, power state, link state, request-list base and SMMU mappings before changing controller ownership.", "Validate SCSI capacity and GPT reads, then publish the root window and mount the configured UUID."]
findings = ["DadaUfs2 is the board fork of the sheng SM8550 transport, kept in this repository: the SM8550 compatible name and its annotated clock table are gone, and the driver keeps only qcom,ufshc/qcom,sm8750-ufshc, the SM8750 GCC offsets and the dedicated linux root partition. The source file and the NativeUfs runtime classes stay as the catalog records them. SM8550-derived assumptions remain in the SMMU takeover, the sun PHY state and the ICE configuration.", "The transport derives from IOBlockStorageDevice, a class that only the kernelcache's own com.apple.iokit.IOStorageFamily kext may register. Compiling the base class into the kernel panics OSMetaClass with a duplicate class, so the build uses a reference object plus kext bindings instead.", "Verified block mode refuses to publish without an owner-signed policy (policy count invalid). It is opt-in: the plain build defines no NATIVE_VERIFIED_BLOCK, imports no VerifiedRoot symbols and publishes the block device on window readiness, which is the path this board uses.", "The GPT window was verified on the phone by reading the whole table through the adopted controller; the host-side facts are checked by drivers/DadaUfs2/tests/check_sm8750_facts.py.", "On 2026-10-26 the root image on the linux partition (sda36) mounted and the first userland task was exec'd. That exec panicked in IOTaskHasEntitlement because AMFI is not prelinked; the diagnostics area records the guard and the remaining AMFI-dependent paths."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within the partition.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Reads are unverified in this build. The SMMU takeover, QMP v4 sun PHY state and ICE configuration are assumed from the firmware handoff rather than observed.", "No userdata image has been flashed, so the root mount and persistence paths are unqualified."]
next_action = ["Attach the GPT/read observation and the controller state from the next device boot, then flash the userdata image and test the root mount."]


[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/check-dada.py", "scripts/tests/check-kernel-archives.py", "docs/known-values.md", "docs/ufs-dada.md"]
inputs = ["UART7 console at 115200n8, the video console from the GOP handoff, the panic screen and the boot-progress argument.", "A recovery path for a failed boot; nothing is flashed by the build."]
configuration = ["payload.panic_screen = true and the kernel arguments carry -v, debug=0x14e, boot-progress=2 and armcpu-diagnostics=1.", "CONFIG_XNU_DT_PANIC_REGION=y takes the panic log region from the device tree instead of the BCM2837 fallback address."]
procedure = ["Run python3 scripts/check-dada.py --uefi ../uefi-dada before a firmware build; it writes build/dada/check.json.", "Run python3 scripts/tests/check-kernel-archives.py --device ../UniXNU-dada to check the defconfig, archive plan and builder products without Xcode.", "Record the last completed checkpoint, the first failing operation and the image revision with every boot."]
findings = ["The BCM2837 panic-log fallback writes to a DRAM hole on this board and hangs the boot before the console exists; the device-tree lookup with no panic region skips the path.", "The OSMetaClass duplicate-class panic, the AMFI No-PMGR panic and the trust-cache runtime panic were each removed by the prelink and defconfig choices recorded in docs/known-values.md.", "The preflight checks the UFS compatible and clock facts against the stock firmware DTB and the kernel archive plan against the defconfig, so a rename or offset change fails before a device boot.", "The first userland exec panics at IOTaskHasEntitlement+0x44 (data abort, far 0x1b0, esr 0x96000006) because the kernel prelinks no AMFI and the entitlement query dereferences the NULL amfi interface. The call chain is bsdinit_task -> ___mac_execve -> process_signature -> machine_task_process_signature -> IOTaskHasEntitlement. patches/xnu/zzzzz-dada-entitlements-without-amfi.patch returns not-entitled when amfi is NULL so exec continues; this is a bring-up guard, not code-signing policy.", "A second NULL-amfi panic followed from an fsctl/VNOP_IOCTL path in IOUserClient::copyClientEntitlement+0x58 (far 0x1d0, esr 0x96000005). patches/xnu/zzzzzz-dada-more-amfi-null-guards.patch guards that site plus the cs_blob invalidation, csops entitlement and trust-cache query paths.", "AMFI+PMGR cannot be restored here yet: sheng's platform-power instrument needs reference prelink candidates under build/xnu-prelink (owner-root build products) to derive its ApplePMGR and nub bindings, and they are not in this workspace.", "Since the dyld shared cache lives in the SystemOS cryptex, the diagnostics path now enables XNU_OWNER_CACHE_MOUNT in bring-up mode: DadaUfs2 answers native_verified_block_volume_device for the SystemOS APFS volume UUID 8846FE78-2910-4297-AF97-D59BB6F8FC16 and native_verified_block_root_authorized, and docs/patches/unixnu-owner-cache-bringup.patch relaxes the build gate. The kernel mounts the volume at /private/preboot and sets DYLD_SHARED_CACHE_DIR for launchd; a failure panics offline owner SystemOS mount failed with the errno. The bring-up helper tries /private/preboot then /System/Cryptexes/OS, matches the volume by UUID or size, and reports the stage in the panic string so the next boot identifies the failing step. Mount-point order now follows the kernel shared-cache search list (/System/Cryptexes/OS, /private/preboot/Cryptexes/OS, /private/preboot) and the list also carries /private/preboot/System/Library/Caches/com.apple.dyld. The initproc panic appends [cache stage/status device] so a repeated initproc failure distinguishes a stale boot artifact from a successful mount whose cache dyld still rejects. The marker also reports a layout mask (bit 1 Caches, bit 2 System/Library/dyld, bit 4 nested cryptex) so the actual cache path inside the mounted SystemOS volume is observable, and DYLD_SHARED_CACHE_DIR follows the mask. The marker also lists the first directory entries of the mounted volume root so an unexpected cryptex layout is visible without another instrument. The marker also carries the first 24 raw readdir bytes (h<hex>) to decode the dirent layout exactly; that dump showed the APFS readdir entries use the 32-bit layout (u32 ino, u16 reclen, u8 type, u8 namlen, name), which the listing parser now matches. The marker also lists System/Library (lib:) and System/Library/dyld or System/Library/Caches/com.apple.dyld (dyld:/caches:) to reveal the real cache file names. The listing showed System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64e (plus arm64 and .01-.03), so the volume is composed with a union mount at / (CONFIG_XNU_OWNER_CACHE_STARTUP + CONFIG_XNU_OWNER_UNION_SYSTEMOS) instead of a side mount with DYLD_SHARED_CACHE_DIR. With the union mount, launchd reached mer_init and failed in sandbox_get_container_expected; adding com.apple.security.sandbox to the prelink roots pulled AppleMobileFileIntegrity and ApplePMGR in as dependencies, so this build finally prelinks AMFI and PMGR and the next boot tests whether they start without the sheng PMGR subclass. The dada board now reuses the sheng PMGR instrument as drivers/DadaPlatformPower2 with fixed kernelcache bindings (checked in this tree: AON stubs, nub create/read/write and the ApplePMGR vtable slots match), enabled with CONFIG_XNU_SHENG_PMGR=y and boot argument sheng-pmgr=2. The next exec then hit Taking non-sleepable RW lock with preemption enabled in query_trust_cache: CONFIG_XNU_TRUST_CACHE_RUNTIME=n left trust_cache_rt_lock zero-initialised while the AMFI signature path queried it. The runtime is now enabled and early_security_init is restored to com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0 so amfi exists before trust_cache_runtime_init(); no StaticTrustCache is packaged yet. The following boot was killed by exec policy (OS_REASON_EXEC/EXEC_EXIT_REASON_SECURITY_POLICY, no description); patches/xnu/zzzzzzzzzzzzzzz-dada-no-cs-bringup.patch clears ip_mac_return/ip_cs_error under boot argument dada-no-cs=1 while a real StaticTrustCache is still required. The IPSW has no StaticTrustCache.img4; its per-dmg Firmware/*.dmg.trustcache entries were range-downloaded (DoH plus a pinned CDN address, because DNS is hijacked locally) and bundled exactly as scripts/build-original-system-trust.py does, reproducing the profile trust_cache_sha256 pin 7416ca4f. The payload now carries Payloads/kernel.macho.trustcache."]
